<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const theme = localStorage.getItem("coverage-theme-v1");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch {
        // Use the system theme when storage is unavailable.
      }
    </script>
    <link rel="stylesheet" href="/src/style.css" />
    <title>Flatpak daily coverage</title>
  </head>
  <body>
    <div id="root"><p role="status">Loading coverage history...</p></div>
    <noscript
      >Enable JavaScript to view the charts, or
      <a href="./history.json">download the coverage history</a>.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
