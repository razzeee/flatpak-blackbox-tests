name: Development checks

on:
  push:
    branches-ignore: [coverage-history]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage-web:
    name: Coverage site checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm --prefix web ci

      - name: Test history and coverage engine integration
        run: npm --prefix web test

      - name: Check TypeScript and formatting
        run: npm --prefix web run check

      - name: Typecheck and build site
        run: npm --prefix web run build

  static:
    name: Lint and type checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.9"
          python-version: "3.14"
          enable-cache: true

      - name: Install locked development tools
        run: uv sync --locked

      - name: Ruff
        run: uv run --locked ruff check .

      - name: Static JSON formatting
        run: uv run --locked python format_json.py --check

      - name: ty
        run: uv run --locked ty check .

      - name: Strict mypy
        run: uv run --locked mypy

      - name: Check compatibility script
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
          bash -n ci/compatibility.sh
          shellcheck ci/compatibility.sh

  unit:
    name: Unit tests on Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - name: Check out suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.9"
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install D-Bus for runner integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus-daemon

      - name: Install locked development tools
        run: uv sync --locked

      - name: Run unit tests
        run: uv run --locked python -m unittest discover -v -p 'test_*.py'
