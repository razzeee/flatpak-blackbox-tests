name: Reference compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Full suite against pinned Flatpak 1.19.1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # Fixed reference exporter and target, not an arbitrary implementation selector.
      FLATPAK_REFERENCE_COMMIT: 1a6ec6a1f720fb30d76c76e656ac624fcaa237e9
    steps:
      - name: Check out suite
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Initialize isolated CI directories
        run: |
          export TMPDIR="$RUNNER_TEMP/bb-t"
          export BB_CI_ROOT="$RUNNER_TEMP/bb-compat"
          printf 'TMPDIR=%s\nBB_CI_ROOT=%s\n' "$TMPDIR" "$BB_CI_ROOT" >> "$GITHUB_ENV"
          bash ci/compatibility.sh init

      - name: Install host dependencies and enable runner namespaces
        run: bash ci/compatibility.sh host

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.9"
          python-version: "3.14"
          enable-cache: false

      - name: Install locked Python tools
        run: uv sync --locked 2>&1 | tee "$BB_CI_ROOT/logs/uv-sync.log"

      - name: Build pinned reference Flatpak
        run: bash ci/compatibility.sh build

      - name: Probe ordinary-user and nested sandbox support
        run: bash ci/compatibility.sh probe

      - name: Prepare complete independent fixture inputs
        run: bash ci/compatibility.sh prepare

      - name: Run all CLI and library scenarios as the runner user
        run: bash ci/compatibility.sh run

      - name: Upload reports and diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          # Deliberately select evidence files, not fixtures, keys or build trees.
          path: |
            ${{ runner.temp }}/bb-compat/results/report.json
            ${{ runner.temp }}/bb-compat/results/coverage.md
            ${{ runner.temp }}/bb-compat/results/*.log
            ${{ runner.temp }}/bb-compat/logs/
            ${{ runner.temp }}/bb-compat/target.json
            ${{ runner.temp }}/bb-compat/build/meson-logs/meson-log.txt
