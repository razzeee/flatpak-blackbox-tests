name: Reference compatibility

on:
  push:
    branches-ignore: [coverage-history]
  pull_request:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Pinned baseline version or commit (blank uses current)"
        type: string
        default: ""
  schedule:
    - cron: "0 21 * * *"
      timezone: "Europe/Berlin"

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare compatibility matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out suite
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Generate compatibility matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASELINE: ${{ inputs.baseline }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const config = JSON.parse(fs.readFileSync("ci/baselines.json", "utf8"));
          const baselines = config.baselines;
          const selector = process.env.BASELINE;

          function resolveBaseline(value) {
            if (!value) return baselines.find((item) => item.commit === config.current);
            const byCommit = baselines.find((item) => item.commit === value);
            if (byCommit) return byCommit;
            const matches = baselines.filter((item) => item.version === value);
            if (matches.length === 1) return matches[0];
            throw new Error(`Unknown or ambiguous baseline: ${value}`);
          }

          const entries = process.env.EVENT_NAME === "schedule"
            ? [
                ...baselines.map((baseline) => ({
                  track: "pinned",
                  baseline: baseline.commit,
                })),
                { track: "upstream", baseline: "" },
              ]
            : [{ track: "pinned", baseline: resolveBaseline(selector).commit }];
          console.log(`matrix=${JSON.stringify({ include: entries })}`);
          NODE

  compatibility:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.track == 'upstream' && 'Full suite against upstream main' || format('Full suite against pinned baseline {0}', matrix.baseline) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: compatibility-${{ matrix.track }}-${{ matrix.baseline || 'upstream' }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      # Both ordinary test users must be able to traverse the build and fixture paths.
      BB_CI_ROOT: /tmp/bb-compat
      TMPDIR: /tmp/bb-t
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out suite
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node for baseline and coverage tools
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install baseline and coverage tools
        run: npm --prefix web ci

      - name: Select pinned baseline
        if: matrix.track == 'pinned'
        env:
          BASELINE: ${{ matrix.baseline }}
        run: |
          npm --prefix web run --silent baseline -- --baseline "$BASELINE" >> "$GITHUB_ENV"

      - name: Resolve latest upstream main
        if: matrix.track == 'upstream'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(gh api repos/flatpak/flatpak/commits/main --jq .sha)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'FLATPAK_REFERENCE_COMMIT=%s\n' "$commit" >> "$GITHUB_ENV"
          printf 'Testing flatpak/flatpak main at %s\n' "$commit"

      - name: Initialize isolated CI directories
        run: bash ci/compatibility.sh init

      - name: Install host dependencies and enable runner namespaces
        run: bash ci/compatibility.sh host

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.9"
          python-version: "3.14"
          enable-cache: false

      - name: Install locked Python tools
        run: uv sync --locked 2>&1 | tee "$BB_CI_ROOT/logs/uv-sync.log"

      - name: Build selected reference Flatpak
        run: bash ci/compatibility.sh build

      - name: Probe ordinary-user and nested sandbox support
        run: bash ci/compatibility.sh probe

      - name: Prepare complete independent fixture inputs
        run: bash ci/compatibility.sh prepare

      - name: Provision and probe the system helper with two ordinary users
        run: bash ci/compatibility.sh system

      - name: Run all CLI and library scenarios as the runner user
        # run.py appends coverage and timings to the automatic GITHUB_STEP_SUMMARY.
        run: bash ci/compatibility.sh run

      - name: Clean up system-helper test provisioning
        if: always()
        run: |
          if [[ -d "${BB_CI_ROOT:-}/system-helper-state" ]]; then
            bash ci/compatibility.sh cleanup
          fi

      - name: Summarize an interrupted compatibility run
        if: always()
        env:
          BB_CI_ROOT: /tmp/bb-compat
        run: bash ci/compatibility.sh summary

      - name: Record daily coverage snapshot
        if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        env:
          TRACK: ${{ matrix.track }}
          SUITE_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          npm --prefix web run history -- record \
            --report "$BB_CI_ROOT/results/report.json" \
            --track "$TRACK" --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --suite-commit "$SUITE_COMMIT" --target-commit "$FLATPAK_REFERENCE_COMMIT" \
            --run-url "$RUN_URL" \
            --output "$RUNNER_TEMP/coverage-snapshot-${TRACK}-${{ matrix.baseline || 'upstream' }}.json"

      - name: Upload daily coverage snapshot
        if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-snapshot-${{ matrix.track }}-${{ matrix.baseline || 'upstream' }}
          path: ${{ runner.temp }}/coverage-snapshot-${{ matrix.track }}-${{ matrix.baseline || 'upstream' }}.json
          if-no-files-found: error

      - name: Upload reports and diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.track }}-${{ matrix.baseline || 'upstream' }}
          retention-days: 14
          if-no-files-found: warn
          # Deliberately select evidence files, not fixtures, keys or build trees.
          path: |
            ${{ env.BB_CI_ROOT }}/results/report.json
            ${{ env.BB_CI_ROOT }}/results/coverage.md
            ${{ env.BB_CI_ROOT }}/results/job-summary.md
            ${{ env.BB_CI_ROOT }}/results/*.log
            ${{ env.BB_CI_ROOT }}/logs/
            ${{ env.BB_CI_ROOT }}/target.json
            ${{ env.BB_CI_ROOT }}/build/meson-logs/meson-log.txt

  coverage-pages:
    name: Publish daily coverage
    needs: compatibility
    if: always() && !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: coverage-pages
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out reporting tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download snapshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-snapshot-*
          merge-multiple: true
          path: ${{ runner.temp }}/coverage-input

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install coverage tools
        run: npm --prefix web ci

      - name: Check out history working directory
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: coverage-site

      - name: Restore durable history
        working-directory: coverage-site
        run: |
          if git ls-remote --exit-code origin refs/heads/coverage-history; then
            git fetch origin coverage-history
            git checkout -B coverage-history FETCH_HEAD
          else
            status=$?
            if [[ "$status" != 2 ]]; then exit "$status"; fi
            git checkout --orphan coverage-history
            git rm -rf .
          fi

      - name: Update daily history and generate charts
        run: |
          for snapshot in "$RUNNER_TEMP"/coverage-input/coverage-snapshot-*.json; do
            npm --prefix web run history -- update \
              --snapshot "$snapshot" \
              --history "$GITHUB_WORKSPACE/coverage-site/history.json"
          done
          cp coverage-site/history.json web/public/history.json
          npm --prefix web run build

      - name: Save durable history
        working-directory: coverage-site
        run: |
          git add history.json
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions[bot] \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -m "Update daily coverage"
            git push origin HEAD:coverage-history
          fi

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web/dist

      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
